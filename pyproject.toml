[project]
name = "mujoco-warp-contactbench"
version = "0.1.0"
description = "Standalone MJX-Warp contact export and ManoRL reference replay."
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "imageio",
  "imageio-ffmpeg",
  "mujoco==3.10.0",
  "mujoco-mjx[warp]==3.10.0",
  "warp-lang",
  "jax[cuda12]>=0.4.35",
  "gymnasium==1.3.0",
  "skrl==2.1.0",
  "torch==2.13.0+cu129",
  "pylance==0.24.1",
  "pyarrow==24.0.0",
  "scipy",
  "pydantic>=2.0.0",
  "jsonc-parser>=1.1.5",
  "pyyaml>=6.0.0",
  "loguru>=0.7.0",
  "rerun-sdk>=0.34.1",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
