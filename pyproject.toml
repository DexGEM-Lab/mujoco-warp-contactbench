[project]
name = "mujoco-warp-contactbench"
version = "0.1.0"
description = "Standalone MJX-Warp sim-to-Lance export pipeline."
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy",
  "imageio",
  "imageio-ffmpeg",
  "mujoco==3.10.0",
  "mujoco-mjx[warp]>=3.10",
  "warp-lang",
  "jax>=0.4.35",
  "pylance==0.24.1",
  "pyarrow==24.0.0",
  "pydantic>=2.0.0",
  "jsonc-parser>=1.1.5",
  "pyyaml>=6.0.0",
  "loguru>=0.7.0",
]

[project.optional-dependencies]
dexhandrl = [
  "gymnasium>=1.0,<2.0",
  "skrl>=2.1,<2.2",
  "torch>=2.0",
]

[tool.uv]
package = false
