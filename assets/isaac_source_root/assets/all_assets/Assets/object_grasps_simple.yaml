# Object Grasp Configuration (Simplified Naming)
#
# Format:
#   object_type:
#     "action_id": [thumb3, index3, ...]
#
# Naming Convention:
#   {finger}{number}
#   - thumb1/thumb2/thumb3 = CMC/MCP/IP
#   - index1/index2/index3 = MCP/PIP/DIP
#   - middle1/middle2/middle3 = MCP/PIP/DIP
#   - ring1/ring2/ring3 = MCP/PIP/DIP
#   - pinky1/pinky2/pinky3 = MCP/PIP/DIP
#   - palm = palm
#
# Notes:
#   - index3 means the distal joint / fingertip side
#   - Organized by object type first

